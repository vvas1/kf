services:
  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "sh", "-c", "echo '' | nc -w1 localhost 8080"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
